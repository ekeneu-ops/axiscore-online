<style>
:root{

*{box-sizing:border-box}

.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.brand{font-weight:700;font-size:16px}
.brand small{color:var(--mut);font-weight:500;margin-left:8px;font-size:12px}
.asof{margin-left:auto;color:var(--mut);font-size:12px;text-align:right;line-height:1.4}
.tabs{display:flex;gap:2px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;}
.tab{padding:11px 16px;font-size:13px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}

.kv{font-size:27px;font-weight:700;letter-spacing:-.5px}
.ks{font-size:12px;color:var(--mut);margin-top:5px}
.hero{background:linear-gradient(135deg,#eef4ff,#fff);border-color:#cfe0ff}
.hero .kv{font-size:38px;color:var(--accent)}
.bar{height:10px;border-radius:6px;background:#eef1f6;overflow:hidden;display:flex}
.bar>span{display:block;height:100%}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
thead th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;background:#fbfcfe;position:sticky;top:0;z-index:1}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#f0f6ff}
.chip{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:5px;color:#fff}
.chip.ESS{background:var(--ess)} .chip.SPR{background:var(--spr)}
.note{font-size:12.5px;color:var(--mut);line-height:1.6}
.flag{border-left:3px solid var(--review);background:#fff6ef;padding:11px 14px;border-radius:0 10px 10px 0;font-size:13px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.btn{font-size:12.5px;padding:6px 13px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--mut);cursor:pointer}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.steps{display:flex;flex-wrap:wrap;gap:8px}
.step{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12.5px}
.dot{width:9px;height:9px;border-radius:50%}.dot.done{background:var(--pay)}.dot.pend{background:var(--review)}
.sys{display:grid;grid-template-columns:170px 1fr;gap:3px 16px;font-size:13px}
.sys div:nth-child(odd){color:var(--mut)}
.tablecard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
/* modal */
.ov{display:none;position:fixed;inset:0;background:rgba(20,30,50,.45);z-index:50;align-items:flex-start;justify-content:center;padding:60px 16px}
.ov.on{display:flex}
.modal{background:#fff;border-radius:14px;max-width:780px;width:100%;box-shadow:0 20px 60px rgba(20,30,50,.3);overflow:hidden}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh .x{margin-left:auto;cursor:pointer;color:var(--mut);font-size:20px;line-height:1;border:none;background:none}
.modal .mb{padding:16px 20px;max-height:72vh;overflow:auto}
.kvrow{display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.kvrow span:first-child{color:var(--mut)}
.kvrow b{font-variant-numeric:tabular-nums;text-align:right}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
@media(max-width:640px){.dgrid{grid-template-columns:1fr}}
.dsect{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--panel2)}
.dst{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700;margin-bottom:5px}
.dsect .kvrow:last-child{border-bottom:none}
.dbadge{display:inline-block;font-size:11.5px;background:#eef4ff;color:var(--accent);border:1px solid #cfe0ff;border-radius:7px;padding:4px 10px}

// PAY/REVIEW is computed LIVE from the recon feed over the exact statement population — both vendors, no precomputed flag.
let prThresh=10;
function renderPayReview(){
  const host=document.getElementById("v-payreview"); if(!host) return;
  const idx=RECONIDX||{};
  const CRED=(((typeof APDATA!=="undefined"&&APDATA&&APDATA.credits)||DATA.credits||{}).by_order)||{};
  const vend={ESS:{pay:0,payAmt:0,dev:0,noexp:0,nofeed:0,await:0,awaitAmt:0,rev:0,revAmt:0,cred:0,credAmt:0,part:0},
              SPR:{pay:0,payAmt:0,dev:0,noexp:0,nofeed:0,await:0,awaitAmt:0,rev:0,revAmt:0,cred:0,credAmt:0,part:0}};
  const reviewRows=[]; const creditedRows=[];
  (DATA.drill||[]).forEach(r=>{
    const t=vend[r.v]; if(!t) return;
    const d=idx[String(r.order).toUpperCase()];
    if(!d){ t.nofeed++; t.rev++; t.revAmt+=r.amount; reviewRows.push(Object.assign({},r,{disc:null,why:"not yet in feed"})); return; }
    const exp=(d.exp_item_cost||0)+(d.exp_ship_cost||0);
    const act=(d.act_item_cost||0)+(d.act_ship_cost||0);
    const disc=(d.disc_amt!=null)?d.disc_amt:(act-exp);
    // Vendor invoice (actual) not captured yet → cannot grade a deviation → WAIT, not REVIEW.
    if(act<=0){ t.await++; t.awaitAmt+=r.amount; return; }
    if(exp<=0){ t.noexp++; t.rev++; t.revAmt+=r.amount; reviewRows.push(Object.assign({},r,{disc:disc,why:"no expected cost"})); return; }
    if(Math.abs(disc)<=prThresh){ t.pay++; t.payAmt+=r.amount; }
    else {
      const cr=CRED[String(r.order).toUpperCase()]; const crS=cr?cr.s:0;
      if(disc>0&&crS>=disc-0.005){ t.cred++; t.credAmt+=r.amount; creditedRows.push(Object.assign({},r,{disc:disc,crs:crS,why:"fully credited"})); }
      else if(disc>0&&crS>0){ t.dev++; t.rev++; t.revAmt+=r.amount; t.part++; reviewRows.push(Object.assign({},r,{disc:disc,crs:crS,rem:disc-crS,why:"deviates "+f$(disc)+" · credit "+f$(crS)+" · REMAINING "+f$(disc-crS)})); }
      else { t.dev++; t.rev++; t.revAmt+=r.amount; reviewRows.push(Object.assign({},r,{disc:disc,crs:0,why:"deviates "+f$(disc)})); }
    }
  });
  reviewRows.sort((a,b)=>Math.abs(b.disc||0)-Math.abs(a.disc||0));
  creditedRows.sort((a,b)=>(b.crs||0)-(a.crs||0));
  const card=(name,t)=>`<div class="card"><div class="kl">${name}</div>
     <div class="kv"><span style="color:var(--pay)">${i$(t.pay)}</span> / <span style="color:var(--review)">${i$(t.rev)}</span> / <span style="color:var(--wait)">${i$(t.await)}</span></div>

<script>
/* P6 Held-Funds v2: live SC source (held_published_v2) + STALE badge + dead-session fallback. Overrides renderHeldLive. */
(function(){
  function f(n){ try{return f$(n);}catch(e){return "$"+(Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});} }
  function ageH(iso){ try{return (Date.now()-new Date(iso).getTime())/3600000;}catch(e){return 1e9;} }
  function cell(t,r,b){ return "<td style='padding:6px 10px;border-bottom:1px solid #e3e8f0;"+(r?"text-align:right;font-variant-numeric:tabular-nums":"")+(b?";font-weight:700":"")+"'>"+t+"</td>"; }
  function draw(){
    var hp=window.HELDPUB; var host=document.getElementById("v-held"); if(!hp||!host) return;
    var ah=ageH(hp.as_of), stale=ah>24, days=Math.floor(ah/24);
    var badge = stale
      ? "<span style='background:#c03a2b;color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700'>STALE — "+days+"d old · Seller Central re-auth needed</span>"
      : "<span style='background:#0a7d4f;color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700'>LIVE</span>";
    var rowsArr=[["Standard Orders",hp.standard],["Invoiced Orders",hp.invoiced],["Deferred Transactions",hp.deferred],["All Accounts",{total:hp.all_total,avail:hp.all_avail}]];
    var rows=rowsArr.map(function(x){ var b=(x[0]==="All Accounts"); return "<tr>"+cell(x[0],false,b)+cell(f(x[1].total),true,b)+cell(f(x[1].avail),true,b)+"</tr>"; }).join("");
    var fb="";
    var APD=(typeof APDATA!=='undefined'&&APDATA)?APDATA:(window.APDATA||null);
    if(stale && APD && APD.held && APD.held.net!=null){
      fb="<p style='font-size:12px;color:#a96a00;margin-top:8px'><b>Fallback while the SC session is down — API estimate "+f(APD.held.net)+"</b> — lags ~48h, NOT Seller Central; cannot split Standard vs Invoiced. Shown only because the live read is stale; does not feed cash-impact.</p>";
    }
    host.innerHTML="<h2 style='font-size:16px;margin:18px 0 6px;color:#0b5cad'>Amazon held funds — Seller Central published balance &nbsp; "+badge+"</h2>"
      +"<p style='font-size:12px;color:#5a6172;margin:0 0 8px'>Source: live Seller Central Payments balance API · pulled "+((hp.as_of||"").replace('T',' ').slice(0,16))+" UTC · gross×0.75 estimate retired.</p>"
      +"<table style='width:100%;border-collapse:collapse;margin:8px 0;font-size:13px'><thead><tr>"
      +"<th style='text-align:left;padding:6px 10px;border-bottom:2px solid #d4dce8'>Bucket</th>"
      +"<th style='text-align:right;padding:6px 10px;border-bottom:2px solid #d4dce8'>Total Balance</th>"
      +"<th style='text-align:right;padding:6px 10px;border-bottom:2px solid #d4dce8'>Funds Available</th></tr></thead><tbody>"+rows+"</tbody></table>"
      +"<p style='font-size:12px;color:#5a6172'>This tab and the Net Position held line read the same file (finance/data/held_published.json) — one source, no local math.</p>"
      +fb;
  }
  window.renderHeldLive=function(){ draw(); };
  fetch("../data/held_published.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).then(function(hp){ if(hp){ window.HELDPUB=hp; draw(); } }).catch(function(){});
})();
</script>
