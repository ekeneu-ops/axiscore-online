name: debug-oidc-sub
on: workflow_dispatch
permissions:
  id-token: write
jobs:
  show:
    runs-on: ubuntu-latest
    environment: spine-read
    steps:
      - name: Print ONLY the sub claim (never the token)
        run: |
          TOK=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          PAY=$(echo "$TOK" | cut -d. -f2)
          PAD=$(( (4 - ${#PAY} % 4) % 4 )); PAY="$PAY$(printf '=%.0s' $(seq 1 $PAD))"
          echo "SUB: $(echo "$PAY" | tr '_-' '/+' | base64 -d 2>/dev/null | jq -r .sub)"
